@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1712;--card:#18221b;--fg:#e8f0ea;--mut:#9db0a3;--line:#2a3a2f;--acc:#4ade80;--acc-fg:#07210f;--acc-soft:#173523;--ok:#4ade80;--bad:#ff8a80;--warn:#fbbf24;--chip:#213027;--shadow:none;color-scheme:dark}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 28px;-webkit-overflow-scrolling:touch}

h1{font-size:1.45rem;line-height:1.2;margin:.2rem 0 .6rem;text-wrap:balance}
h2{font-size:1.15rem;margin:1.1rem 0 .5rem;text-wrap:balance}
h3{font-size:1.02rem;margin:.2rem 0 .4rem}
p{margin:.4rem 0}
.muted{color:var(--mut);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px auto;box-shadow:var(--shadow)}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{appearance:none;border:0;background:var(--acc);color:var(--acc-fg);font:inherit;font-weight:600;padding:11px 18px;border-radius:12px;min-height:44px;cursor:pointer}
.btn.ghost{background:var(--chip);color:var(--fg)}
.btn.line{background:transparent;border:1.5px solid var(--acc);color:var(--acc)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.9rem}

.fld{display:block;margin:10px 0;font-size:.85rem;color:var(--mut)}
.fld input,.fld select,.fld textarea,input.in,select.in{display:block;width:100%;margin-top:4px;padding:11px 12px;font:inherit;font-size:1rem;color:var(--fg);background:var(--card);border:1.5px solid var(--line);border-radius:10px;min-height:44px}
.fld input:focus,.fld select:focus,input.in:focus{outline:2px solid var(--acc);outline-offset:0;border-color:var(--acc)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.seg button{flex:1;min-width:76px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);font:inherit;min-height:42px}
.seg button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-fg);font-weight:600}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:3px 10px;font-size:.82rem;margin:2px 4px 2px 0}
.chip.ok{background:var(--acc-soft);color:var(--ok)}
.chip.bad{background:#fde7e4;color:var(--bad)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.bad{background:#3a1d1a}}

.bar{height:10px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.bar.over>i{background:var(--warn)}
.note{background:var(--acc-soft);border-radius:12px;padding:10px 12px;font-size:.9rem;margin:10px 0}
.note.warn{background:#fff3d6;color:#6b4700}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .note.warn{background:#3a2e10;color:#fbd77a}}
:root[data-theme="dark"] .note.warn{background:#3a2e10;color:#fbd77a}
.list{margin:0;padding:0;list-style:none}

.list li:last-child{border-bottom:0}

#toast.show{opacity:1}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
#modal .mbox{background:var(--card);color:var(--fg);border-radius:16px;padding:18px;width:100%;max-width:440px;max-height:90%;overflow:auto}

<script>
/* C:\gf\kit – közös mag két új apphoz (Your TÁP, Work Plate): i18n (HU/EN), útválasztó, tároló, modál, titkosított tár (WebCrypto), fájlmentés/-betöltés.
   Az app a saját első JS-fájljában hívja a K.init({ns, name, tabs, start}) függvényt. */
'use strict';
const K = window.K = {screens: {}, tabs: [], stack: [], dict: {hu: {}, en: {}}, lang: 'en', cfg: {}, data: null};
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

/* ---- tároló (localStorage, védett) ---- */
K.ls = {
  get(k, d) { try { const v = localStorage.getItem(K.ns + '.' + k); return v == null ? d : JSON.parse(v) } catch (e) { return d } },
  raw(k) { try { return localStorage.getItem(K.ns + '.' + k) } catch (e) { return null } },
  set(k, v) { try { localStorage.setItem(K.ns + '.' + k, JSON.stringify(v)); return true } catch (e) { return false } },
  setRaw(k, s) { try { localStorage.setItem(K.ns + '.' + k, s); return true } catch (e) { return false } },
  del(k) { try { localStorage.removeItem(K.ns + '.' + k) } catch (e) {} },
  wipeAll() { try { Object.keys(localStorage).filter(k => k.indexOf(K.ns + '.') === 0).forEach(k => localStorage.removeItem(k)) } catch (e) {} }
};

/* ---- nyelv ---- */
K.t = (key, vars) => {
  let s = (K.dict[K.lang] && K.dict[K.lang][key]); if (s == null) s = K.dict.en[key]; if (s == null) s = key;
  if (vars) Object.keys(vars).forEach(k => { s = s.split('{' + k + '}').join(vars[k]) });
  return s;
};
K.L = o => o == null ? '' : typeof o === 'string' ? o : (o[K.lang] != null ? o[K.lang] : (o.en != null ? o.en : o.hu));   // {hu,en} objektumból az aktuális nyelv
K.setLang = l => { K.lang = l === 'hu' ? 'hu' : 'en'; K.ls.set('lang', K.lang); document.documentElement.lang = K.lang; if (K.cur) K.render(); K.buildTabs() };
K.num = (n, d) => n == null || isNaN(n) ? '–' : (Math.round(n * Math.pow(10, d == null ? 0 : d)) / Math.pow(10, d == null ? 0 : d)).toFixed(d == null ? 0 : d).replace('.', K.lang === 'hu' ? ',' : '.');
K.parse = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n };
K.today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') };
K.addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') };
K.fmtDate = iso => { const d = new Date(iso + 'T12:00:00'); return d.toLocaleDateString(K.lang === 'hu' ? 'hu-HU' : 'en-GB', {year: 'numeric', month: 'long', day: 'numeric'}) };
K.fmtDateShort = iso => { const d = new Date(iso + 'T12:00:00'); return d.toLocaleDateString(K.lang === 'hu' ? 'hu-HU' : 'en-GB', {month: 'short', day: 'numeric'}) };
K.uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---- útválasztó ---- */
K.go = (name, arg, replace) => { if (!replace && K.cur) K.stack.push(K.cur); K.cur = {name, arg}; K.render() };
K.root = (name, arg) => { K.stack = []; K.cur = {name, arg}; K.render() };
K._later = [];
K.later = fn => { K._later.push(fn) };
K.render = () => {
  const sc = K.screens[K.cur.name], v = $('#view');
  if (!sc) return;
  v.innerHTML = ''; v.scrollTop = 0; K._later = [];
  const out = sc(K.cur.arg); if (typeof out === 'string') v.innerHTML = out;
  const q = K._later; K._later = []; q.forEach(f => f());
  $$('#tabbar button').forEach(b => b.classList.toggle('on', b.dataset.t === (sc.tab || K.cur.name)));
  document.body.dataset.screen = K.cur.name; K.syncBars();
};
window.appBack = () => {
  if ($('#modal')) { K._modalClose(null); return true }
  if ($('#imgv')) { $('#imgv').remove(); return true }
  if (!K.stack.length) return false; K.cur = K.stack.pop(); K.render(); return true;
};
window.appSave = () => { if (K.vault) K.vault.flush(); if (K.onSave) K.onSave() };
K.buildTabs = () => {
  const tb = $('#tabbar'); if (!tb) return;
  tb.innerHTML = K.tabs.map(t => '<button type="button" data-t="' + t.id + '"><span class="ic">' + t.ic + '</span><span>' + esc(K.t(t.label)) + '</span></button>').join('');
  $$('#tabbar button').forEach(b => b.addEventListener('click', () => K.root(b.dataset.t)));
  if (K.cur) $$('#tabbar button').forEach(b => b.classList.toggle('on', b.dataset.t === ((K.screens[K.cur.name] || {}).tab || K.cur.name)));
};
K.showTabs = on => { const tb = $('#tabbar'); if (tb) tb.style.display = on ? '' : 'none' };

/* ---- üzenetek és párbeszédek (nincs alert/confirm/prompt) ---- */
K.toast = m => { let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t) } t.textContent = m; t.classList.add('show'); clearTimeout(K._tt); K._tt = setTimeout(() => t.classList.remove('show'), 2600) };
K._modalClose = v => { const m = $('#modal'); if (m) m.remove(); const f = K._modalRes; K._modalRes = null; if (f) f(v) };
/** K.ask({title, body (HTML), inputs:[{id,type,label,placeholder,value,autocomplete}], ok, cancel, danger}) -> Promise<{id: érték}|null> */
K.ask = o => new Promise(res => {
  K._modalRes = res;
  const m = document.createElement('div'); m.id = 'modal';
  m.innerHTML = '<div class="mbox" role="dialog" aria-modal="true"><h3>' + esc(o.title || '') + '</h3>' + (o.body ? '<div class="mbody">' + o.body + '</div>' : '') +
    (o.inputs || []).map(i => '<label class="fld">' + esc(i.label || '') + '<input id="m_' + i.id + '" type="' + (i.type || 'text') + '" placeholder="' + esc(i.placeholder || '') + '" value="' + esc(i.value || '') + '" autocomplete="off"' + (i.inputmode ? ' inputmode="' + i.inputmode + '"' : '') + '></label>').join('') +
    '<div class="mbtn">' + (o.cancel === false ? '' : '<button type="button" class="btn ghost" id="m_cancel">' + esc(o.cancel || K.t('cancel')) + '</button>') + '<button type="button" class="btn' + (o.danger ? ' danger' : '') + '" id="m_ok">' + esc(o.ok || 'OK') + '</button></div></div>';
  document.body.appendChild(m);
  const done = ok => { const out = {}; (o.inputs || []).forEach(i => { out[i.id] = $('#m_' + i.id, m).value }); $$('[data-k]', m).forEach(e => { out[e.dataset.k] = e.value }); K._modalClose(ok ? out : null) };   /* a törzsbe tett [data-k] mezők értéke is visszajön */
  $('#m_ok', m).addEventListener('click', () => done(true));
  const c = $('#m_cancel', m); if (c) c.addEventListener('click', () => done(false));
  $$('input', m).forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') done(true) }));
  const f = $('input', m); if (f) setTimeout(() => f.focus(), 50);
});

/* ---- fájl-műveletek: Android-híd, böngészőben letöltés ---- */
K.saveText = (name, text, mime) => {
  if (window.App && App.exportData) { const r = String(App.exportData(name, text)); if (r.indexOf('HIBA') === 0) K.toast(r); else K.toast(K.t('saved_to', {p: r})); return r }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: mime || 'application/json'})); a.download = name; document.body.appendChild(a); a.click(); a.remove(); return name;
};
K.pickText = () => new Promise(res => {
  if (window.App && App.importData) { window.onImportData = t => { window.onImportData = null; res(t) }; App.importData(); return }
  const i = document.createElement('input'); i.type = 'file'; i.onchange = () => { const f = i.files[0]; if (!f) return res(null); const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = () => res(null); r.readAsText(f) }; i.click();
});
/** Bináris fájl(ok) választása: Promise<[{name, bytes:Uint8Array} | {name, big:true}] | null>. Androidon a héj okmány-választója, böngészőben <input type=file multiple>. */
K.pickFiles = () => new Promise(res => {
  if (window.App && App.importBinary) { window.onImportBinary = l => { window.onImportBinary = null; res(l ? l.map(x => x.big ? {name: x.name, big: true} : {name: x.name, bytes: b64d(x.b64)}) : null) }; App.importBinary(); return }
  const i = document.createElement('input'); i.type = 'file'; i.multiple = true; i.onchange = async () => { const fs = Array.from(i.files || []); if (!fs.length) return res(null); res(await Promise.all(fs.map(async f => ({name: f.name, bytes: new Uint8Array(await f.arrayBuffer())})))) }; i.click();
});
/** Fénykép: Promise<dataURL (JPEG, legfeljebb ~1000 px) | null>. Androidon a héj hívja a rendszer-kamerát (engedély nélkül), böngészőben fájl-választó. */
K.shrinkImage = (file, max, q) => new Promise((res, rej) => { const url = URL.createObjectURL(file), im = new Image(); im.onload = () => { const s = Math.min(1, (max || 1000) / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q || 0.6)) }; im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')) }; im.src = url });
K._photoFile = (res, cam) => { const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; if (cam) i.setAttribute('capture', 'environment'); i.onchange = () => { const f = i.files[0]; if (!f) return res(null); K.shrinkImage(f, 1600, 0.8).then(res, () => res(null)) }; i.click() };
K.takePhoto = () => new Promise(res => { if (window.App && App.takePhoto) { window.onPhoto = d => { window.onPhoto = null; res(d || null) }; App.takePhoto(); return } K._photoFile(res, true) });
K.pickPhoto = () => new Promise(res => { if (window.App && App.pickPhoto) { window.onPhoto = d => { window.onPhoto = null; res(d || null) }; App.pickPhoto(); return } K._photoFile(res, false) });
K.shareFile = (name, text, mime) => {   // fájl mentése + rendszer-megosztó (Android); böngészőben letöltés
  if (window.App && App.shareFile) { const u = new TextEncoder().encode(text); let b = ''; for (let i = 0; i < u.length; i += 8192) b += String.fromCharCode.apply(null, u.subarray(i, i + 8192)); const r = String(App.shareFile(name, mime || 'application/octet-stream', btoa(b))); if (r.indexOf('HIBA') === 0) K.toast(r); return r }
  return K.saveText(name, text, mime);
};
K.shareText = (title, text) => { if (window.App && App.shareText) App.shareText(title, text); else K.saveText(String(title).replace(/[^A-Za-z0-9._-]/g, '_') + '.txt', text, 'text/plain') };
K.print = (title, html) => { if (window.App && App.printHtml) App.printHtml(title, html); else { const w = window.open('', '_blank'); if (w) { w.document.write(html); w.document.close(); setTimeout(() => w.print(), 300) } else K.saveText(title + '.html', html, 'text/html') } };

/* ---- WebCrypto: AES-GCM + PBKDF2 ---- */
const b64e = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return btoa(s) };
const b64d = s => { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u };
K.cryptoOk = () => !!(window.crypto && crypto.subtle);
K.deriveKey = async (pass, salt, it) => {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name: 'PBKDF2', salt, iterations: it || 250000, hash: 'SHA-256'}, km, {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);
};
K.encWith = async (obj, key, salt, it) => {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name: 'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(obj))));
  return {v: 1, alg: 'AES-GCM/PBKDF2-SHA256', it: it || 250000, s: b64e(salt), i: b64e(iv), c: b64e(ct)};
};
K.enc = async (obj, pass, it) => { const salt = crypto.getRandomValues(new Uint8Array(16)); it = it || 250000; return K.encWith(obj, await K.deriveKey(pass, salt, it), salt, it) };
/** Visszafejt; hibás jelszó/sérült adat esetén null. A másodikként a származtatott kulcsot is adja (mentéshez). */
K.dec = async (blob, pass) => {
  try {
    const salt = b64d(blob.s), key = await K.deriveKey(pass, salt, blob.it);
    const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64d(blob.i)}, key, b64d(blob.c));
    return {data: JSON.parse(new TextDecoder().decode(pt)), key, salt, it: blob.it};
  } catch (e) { return null }
};

/* ---- „tár": a teljes felhasználói adat egy objektum (K.data); lehet titkosított (jelszó/PIN) ---- */
K.vault = {
  _t: null, _key: null, _salt: null,
  enabled() { return !!K.ls.raw('enc') },
  load(defaults) { /* 'open' (K.data kész) | 'locked' (jelszó kell) */
    const e = K.ls.get('enc', null);
    if (e) { K._defaults = defaults; K.data = null; return 'locked' }
    const p = K.ls.get('plain', null); K.data = Object.assign({}, defaults, p || {}); return 'open';
  },
  async unlock(pass) {
    const e = K.ls.get('enc', null); if (!e) return false;
    const r = await K.dec(e, pass); if (!r) return false;
    K.data = Object.assign({}, K._defaults || {}, r.data); this._key = r.key; this._salt = r.salt; this._it = r.it; return true;
  },
  lock() { this.flush(); this._key = null; this._salt = null; if (this.enabled()) K.data = null },
  save() { clearTimeout(this._t); if (!this._key) { this.flush(); return } this._t = setTimeout(() => this.flush(), 250) },   // nem titkosított: azonnal; titkosított: kis késleltetéssel (PBKDF2-mentes, de aszinkron)
  flush() {
    clearTimeout(this._t); this._t = null; if (!K.data) return Promise.resolve();
    if (this._key) { const snap = JSON.stringify(K.data); return K.encWith(JSON.parse(snap), this._key, this._salt, this._it).then(b => K.ls.set('enc', b)).catch(() => 0) }
    if (!this.enabled()) K.ls.set('plain', K.data); return Promise.resolve();
  },
  async enable(pass) { const salt = crypto.getRandomValues(new Uint8Array(16)); this._salt = salt; this._it = 250000; this._key = await K.deriveKey(pass, salt, 250000); await this.flush(); K.ls.del('plain') },
  async disable() { this._key = null; this._salt = null; K.ls.del('enc'); K.ls.set('plain', K.data) },
  async change(pass) { await this.enable(pass) },
  wipe() { this._key = null; this._salt = null; K.data = null; K.ls.wipeAll() },
  async exportBackup(pass, kind) { const b = await K.enc(K.data, pass); return JSON.stringify({app: K.ns, kind: kind || 'backup', v: 1, created: new Date().toISOString(), blob: b}) },
  async importBackup(text, pass) { let j; try { j = JSON.parse(text) } catch (e) { return {err: 'format'} } if (!j || j.app !== K.ns || !j.blob) return {err: 'format'}; const r = await K.dec(j.blob, pass); return r ? {data: r.data} : {err: 'pass'} }
};

'use strict';
K.sfx = {
  NAMES: ['tap', 'place', 'flip', 'good', 'bad', 'combo', 'coin', 'level', 'win', 'lose'],

    good: [[0, .11, 660, null, 'triangle', .26], [.1, .2, 880, null, 'triangle', .26]],
    bad: [[0, .26, 190, 105, 'sawtooth', .2], [0, .26, 196, 110, 'square', .08]],
    combo: [[0, .08, 523, null, 'triangle', .24], [.08, .08, 659, null, 'triangle', .24], [.16, .08, 784, null, 'triangle', .24], [.24, .26, 1047, null, 'triangle', .26]],

    lose: [[0, .18, 392, null, 'sine', .26], [.18, .18, 330, null, 'sine', .26], [.36, .34, 262, null, 'sine', .26]]

  _noise(c) { if (!c._nz) { const n = Math.floor(c.sampleRate * 0.2), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; c._nz = b } return c._nz },

  _sched(c, dest, name, t0, vol) {

    def.forEach(n => {

      const [st, d, f1, f2, type, g] = n, o = c.createOscillator(), gn = c.createGain(); o.type = type; o.frequency.setValueAtTime(f1, t0 + st); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + st + d);

  },
  _buf: {}, _pre: false,
  /** Az ElevenLabs-szal készült hangfájlok (K.sfxData: {név: {u: data-URI, g: erősítés}}) dekódolása az első érintés után; ameddig nincs kész, a szintetizált hang a tartalék */
  async preload() { if (this._pre || !window.K || !K.sfxData) return; this._pre = true; const c = this.ctx(); if (!c) return; for (const n of Object.keys(K.sfxData)) { try { const bin = atob(K.sfxData[n].u.split(',')[1]), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); this._buf[n] = await c.decodeAudioData(a.buffer) } catch (e) {} } },

/* Your TÁP – keresés százalékokkal ("tej 2,8%", "2.8%-os tej", "milk 2.8") és becsült tejek tetszőleges zsír%-hoz (USDA tej-adatokból interpolálva).
   A tejek BECSÜLTEK: a USDA sovány (0,2%), 2%-os és teljes (3,3%) tej értékei között lineárisan számolva; jelölve vannak. */
'use strict';
YT.MILKS = [0.5, 1.5, 2.8, 3.6];   /* a magyar boltokban szokásos zsírtartalmak */
const fmtPct = n => String(Math.round(n * 100) / 100).replace('.', K.lang === 'hu' ? ',' : '.');
/** Becsült tej adott zsír%-hoz (0–6): {id:'milk:2.8', name, k,p,c,f,sat,sug,fib,salt (100 g-ra), src:'recipe', note} */
YT.milkFood = F => {
  if (!(F >= 0 && F <= 6)) return null; F = Math.round(F * 10) / 10; const key = 'milk:' + F;
  YT._mk = YT._mk || {}; if (YT._mk[key]) return YT._mk[key];
  const pt = id => (window.YT_FOODS || []).find(f => f.id === id); const n = pt('c2'), m2 = pt('c1'), w = pt('c0'); if (!n || !m2 || !w) return null;
  const lo = F <= m2.f ? n : m2, hi = F <= m2.f ? m2 : w, x = (F - lo.f) / (hi.f - lo.f), L = k => lo[k] == null || hi[k] == null ? undefined : YT.round(lo[k] + (hi[k] - lo[k]) * x, 2);
  const food = {id: key, name: {hu: 'Tej, ' + String(F).replace('.', ',') + '% zsír (becsült)', en: 'Milk, ' + F + '% fat (estimated)'}, k: Math.round(L('k') * 10) / 10, p: L('p'), c: L('c'), f: F, sat: L('sat'), sug: L('sug'), fib: 0, salt: L('salt'), src: 'recipe',
    note: {hu: 'A USDA sovány (0,2%), 2%-os és teljes (3,3%) tej értékei közé lineárisan számolt becslés; a boltban kapott tej címkéje pontosabb.', en: 'Estimated by linear interpolation between the USDA nonfat (0.2%), 2% and whole (3.3%) milk values; the label of the milk you buy is more precise.'}};
  Object.keys(food).forEach(k => { if (food[k] === undefined) delete food[k] }); YT._mk[key] = food; return food;
};
/* ---- keresés ---- */
const EMO = /\p{Extended_Pictographic}(?:\uFE0F|\u200D\p{Extended_Pictographic})*/gu;
YT.qTokens = raw => {
  const out = []; let rest = String(raw == null ? '' : raw); (rest.match(EMO) || []).forEach(e => out.push({ico: e.replace(/\uFE0F/g, '')})); rest = rest.replace(EMO, ' ');   /* emoji alapján is: azok az ételek, amelyek ikonja ez az emoji */
  rest.replace(/,/g, '.').split(/\s+/).forEach(w => {
    if (!w) return; const m = /^(\d+(?:\.\d+)?)(%?)(?:-?(?:as|es|os|ös|s))?$/i.exec(w);
    if (m) out.push({n: parseFloat(m[1]), raw: m[1], pct: !!m[2]}); else { const t = norm(w.replace(/%/g, '')); if (t) out.push({t}) }
  }); return out;
};
const nameNorm = f => norm(typeof f.name === 'string' ? f.name : (f.name.hu || '') + ' ' + (f.name.en || '')).replace(/,/g, '.');
const namePcts = nn => { const o = []; nn.replace(/(\d+(?:\.\d+)?)\s*%/g, (a, b) => { o.push(parseFloat(b)); return a }); return o };
const numWord = (nn, raw) => new RegExp('(^|[^0-9.])' + raw.replace('.', '\\.') + '(?![0-9]|\\.[0-9])').test(nn);
const runSearch = (toks, all) => all.filter(f => { const nn = nameNorm(f), pc = namePcts(nn); return toks.every(t => t.ico ? YT.foodIcon(f).replace(/\uFE0F/g, '') === t.ico : t.t ? nn.indexOf(t.t) >= 0 : pc.some(p => Math.abs(p - t.n) < 0.001) || numWord(nn, t.raw)) });
/** Keresés a saját és a beépített ételek között; érti a „2,8%", „2.8%-os", „tej 2,8" alakot; ragozott szóra (pl. „tejre") a szótő alapján is talál. */
YT.searchFoods = (raw, limit) => {
  let toks = YT.qTokens(raw); if (!toks.length) return []; const all = YT.allFoods();
  let r = runSearch(toks, all);
  for (let cut = 1; !r.length && cut <= 3; cut++) { const t2 = toks.map(t => t.t && t.t.length - cut >= 3 ? {t: t.t.slice(0, t.t.length - cut)} : t); if (t2.some((t, i) => t !== toks[i])) r = runSearch(t2, all); else break }
  const milk = toks.some(t => t.t && /^(tej|milk)/.test(t.t)), num = toks.find(t => t.n != null);
  if (milk) {
    const gen = (num ? (num.n >= 0 && num.n <= 6 ? [YT.milkFood(num.n)] : []) : YT.MILKS.map(YT.milkFood)).filter(Boolean).filter(g => !r.some(x => x.id !== g.id && namePcts(nameNorm(x)).some(p => Math.abs(p - g.f) < 0.001) && /tej|milk/.test(nameNorm(x))));
    r = gen.filter(g => !r.some(x => x.id === g.id)).concat(r);
  }
  return r.slice(0, limit || 60);
};

   Szabály-alapú (nem orvosi tanács): a küszöbök általános irányelvekre épülnek (pl. WHO: legalább 400 g zöldség és gyümölcs naponta). Az ételjavaslatok a Preferenciák szerint szűrtek (nem allergia-szűrő) és tanulnak a visszajelzésből. */
'use strict';
/* Kiegészítő-ételek szerepenként: [étel-azonosító, adag g, csoport (gyakorisági kérdőív), mely étkezésekhez (b l d s), egység-megjegyzés {hu,en}] */
const U = (h, e) => ({hu: h, en: e});
YT.ADDONS = {
  veg: [['c25', 100, 'veg', 'blds', U('kb. 1 db', 'about 1')], ['c27', 80, 'veg', 'blds', U('kb. ½ db', 'about ½')], ['c28', 80, 'veg', 'blds', U('kb. ½ db', 'about ½')], ['c26', 100, 'veg', 'blds'], ['u186', 80, 'veg', 'blds', U('kb. 1 db', 'about 1')], ['u205', 80, 'veg', 'blds'], ['u197', 60, 'veg', 'blds'], ['u200', 100, 'veg', 'blds'], ['c29', 50, 'veg', 'ld'], ['u235', 80, 'veg', 'ld'], ['u232', 80, 'veg', 'ld'], ['u238', 60, 'veg', 'ld'], ['u252', 100, 'veg', 'ld'],
    ['c35', 150, 'fruit', 'blds', U('1 db', '1')], ['u297', 120, 'fruit', 'blds', U('1 db', '1')], ['u299', 150, 'fruit', 'blds', U('1 db', '1')], ['u301', 100, 'fruit', 'blds', U('1 db', '1')], ['c38', 75, 'fruit', 'blds', U('1 db', '1')], ['c36', 100, 'fruit', 'blds'], ['u310', 150, 'fruit', 'blds'], ['u316', 100, 'fruit', 'blds'], ['u312', 100, 'fruit', 'blds'], ['u294', 150, 'fruit', 'blds', U('1 db', '1')], ['u333', 150, 'fruit', 'blds', U('1 db', '1')], ['u327', 100, 'fruit', 'blds', U('2–3 db', '2–3')], ['u330', 100, 'fruit', 'blds', U('2–3 db', '2–3')], ['u325', 100, 'fruit', 'blds']],
  protein: [['c12', 110, '', 'blds', U('2 db', '2')], ['c4', 150, 'dairy', 'bs'], ['c5', 150, 'dairy', 'bs'], ['slv75', 100, 'dairy', 'blds'], ['slv3243', 100, 'dairy', 'blds'], ['c6', 100, 'dairy', 'blds'], ['slv70', 100, 'dairy', 'blds'], ['slv142', 200, 'dairy', 'bs'], ['c2', 250, 'dairy', 'bs'], ['c7', 40, 'dairy', 'blds'], ['c8', 20, 'dairy', 'blds'], ['u129', 30, 'dairy', 'blds'],
    ['c50', 80, 'fish', 'ld'], ['c51', 120, 'fish', 'ld'], ['c42', 100, '', 'ld'], ['c44', 100, '', 'ld'], ['c53', 150, 'legume', 'ld'], ['c54', 120, 'legume', 'ld'], ['c55', 120, 'legume', 'ld'], ['u264', 100, 'legume', 'ld']],
  fibre: [['c18', 60, 'whole', 'blds'], ['c19', 60, 'whole', 'blds'], ['slv214', 60, 'whole', 'blds'], ['c24', 40, 'whole', 'bs'], ['u140', 150, 'whole', 'ld'], ['c15', 150, 'whole', 'ld'], ['c20', 150, 'whole', 'ld'], ['u312', 100, 'fruit', 'blds'], ['u314', 100, 'fruit', 'blds'], ['u294', 150, 'fruit', 'blds', U('1 db', '1')], ['c53', 150, 'legume', 'ld'], ['c54', 120, 'legume', 'ld'], ['c55', 120, 'legume', 'ld'], ['u235', 100, 'veg', 'ld'], ['u378', 15, 'whole', 'bs']],
  carb: [['c14', 150, '', 'ld'], ['c16', 150, '', 'ld'], ['c22', 200, '', 'ld'], ['u184', 150, '', 'ld'], ['c17', 60, '', 'blds'], ['u297', 120, '', 'blds', U('1 db', '1')], ['c24', 50, '', 'bs']]
};
/** Egy kiegészítés-javaslat. role: veg|protein|fibre|carb; meal: b|l|d|s; o: {date, n (sorszám a „Másik" gombhoz), only ('veg'|'fruit'), gap (g, a fehérje-hiány)} → {f, g, e (bejegyzés-minta), u} | null */
YT.suggestAdd = (role, meal, o) => {
  o = o || {}; const P = YT.PREF(), R = rng(hashS((o.date || '') + '|' + role + '|' + meal + '|' + (P.sw || 0)));   /* a sorrend a „Másik" gombtól független: n-edik elem = n. legjobb */
  let c = (YT.ADDONS[role] || []).map(a => ({a, f: YT.foodById(a[0])})).filter(x => x.f && x.a[3].indexOf(meal) >= 0 && (!o.only || x.a[2] === o.only) && YT.allowed(x.f) && (!x.a[2] || YT.freqW(x.a[2]) > 0));
  if (P.lean) { const l = c.filter(x => (x.f.f || 0) <= 10); if (l.length) c = l }
  if (!c.length) return null;
  const sc = c.map(x => ({x, w: YT.prefW(x.f) * (x.a[2] ? YT.freqW(x.a[2]) : 1) * (0.6 + R() * 0.8)})).sort((p, q) => q.w - p.w), pick = sc[(o.n || 0) % Math.min(sc.length, 5)].x;
  const g = pick.a[1], f = pick.f; return {f, g, u: pick.a[4] || null, e: YT.entryFrom(Object.assign({}, f, {name: K.L(f.name)}), g, meal)};
};
/* ---- zöldség- és gyümölcs-gramm egy naplóbejegyzésben (a burgonya, fokhagyma, csípős paprika és a zöld fűszerek nem számítanak) ---- */
const NOVEG = {potato: 1, garlic: 1, pepper_hot: 1, parsley: 1, dill: 1};
const NOVEG_RE = /potato|juice|dried|jam\b|chips|pickle|canned|syrup|sweetened|vinegar|\boil\b|sauce|ketchup|capers|olives/i;
YT.vegG = e => {
  const f = e.fid ? YT.foodById(e.fid) : null; if (!f) return 0;
  if (f.r && f.serving) { const sv = e.g / f.serving; return f.r.reduce((a, [k, g]) => a + (YT.ingLabel(k).cat === 'zoldseg_gyumolcs' && !NOVEG[k] ? g * sv : 0), 0) }
  const en = (f.name && f.name.en) || ''; if ((YT.gfood(f).group === 'zoldseg' && !NOVEG_RE.test(en)) || /radish|green beans|snow peas/i.test(en)) return e.g || 0; return 0;
};
const VEG_THR = {b: 40, l: 100, d: 100};
YT.REG_SLOTS = ['b', 'm', 'l', 'a', 'd', 'e'];
/** Az étkezések időpontjának rendszeressége: az utolsó `days` nap (a megadott napig), étkezési helyenként, ha legalább 3 napon van időpont.
    Egy nap egy étkezési helyének időpontja a legkorábbi időpontos bejegyzése. Rendszeres, ha a legkorábbi és a legkésőbbi időpont különbsége legfeljebb 60 perc (1 órás sáv). Visszatér: {hely: {n, min, max, med, range, ok}} */
YT.regularity = (date, days) => {
  days = days || 7; const out = {};
  YT.REG_SLOTS.forEach(m => {
    const xs = []; for (let i = 0; i < days; i++) { const x = YT.mealMin(K.addDays(date, -i), m); if (x != null) xs.push(x) }
    if (xs.length < 3) return; xs.sort((a, b) => a - b); const mn = xs[0], mx = xs[xs.length - 1], md = xs.length % 2 ? xs[(xs.length - 1) / 2] : Math.round((xs[xs.length / 2 - 1] + xs[xs.length / 2]) / 2);
    out[m] = {n: xs.length, min: mn, max: mx, med: md, range: mx - mn, ok: mx - mn <= 60};
  });
  return out;
};
/** A nap elemzése. Visszatér null (nincs bejegyzés) vagy {s (összeg), t (célok), meals: {m: {k,p,fib,veg,n,tk}}, veg, good: [], find: [{id,score,ic,title,text,meal?,role?,only?,gap?}]} */
YT.analyze = date => {
  const list = YT.dayEntries(date); if (!list.length) return null;
  const t = YT.targets(), s = YT.sum(list), pr = D().profile, sp = pr.sport && pr.sport.on, goal = pr.goal, mt = YT.mealTargets();
  const isToday = date === K.today(), hr = new Date().getHours(), done = !isToday || hr >= 18, late = !isToday || hr >= 14, r0 = Math.round;
  const meals = {}; MEALS.forEach(m => { const es = list.filter(e => e.meal === m), ms = YT.sum(es); meals[m] = {k: ms.k, p: ms.p, fib: ms.fib, c: ms.c, f: ms.f, veg: es.reduce((a, e) => a + YT.vegG(e), 0), n: es.length, tk: mt ? mt[m].k : null, tp: mt ? mt[m].p : null} });
  const vegAll = MEALS.reduce((a, m) => a + meals[m].veg, 0), find = [], good = [], add = x => find.push(x);
  /* 1) zöldség / gyümölcs étkezésenként (a példa: „reggelire nem ettél zöldséget") */
  let vegFlag = false;
  ['b', 'l', 'd'].forEach(m => { const v = meals[m]; if (v.n && v.veg < VEG_THR[m]) { vegFlag = true; add({id: 'veg_' + m, score: 82 - (v.veg / VEG_THR[m]) * 14, ic: '🥦', meal: m, role: 'veg', only: m === 'b' ? null : 'veg', title: K.t(v.veg < 5 ? 'an_veg_none_' + m : 'an_veg_low_' + m, {x: r0(v.veg / 5) * 5}), text: K.t('an_veg_text_' + m, {x: Math.max(30, Math.round((VEG_THR[m] - v.veg) / 10) * 10)})}) } });
  if (!vegFlag && done && vegAll < 400 && list.length >= 3) add({id: 'veg_total', score: 60, ic: '🥗', meal: meals.l.n ? 'l' : meals.d.n ? 'd' : 'b', role: 'veg', title: K.t('an_veg_total', {x: r0(vegAll / 10) * 10}), text: K.t('an_veg_total_p')});
  /* 2) fehérje */
  const lowProtMeal = () => { let best = null; ['b', 'l', 'd'].forEach(m => { const v = meals[m]; if (!v.n || v.tp == null) return; const r = v.p / v.tp; if (!best || r < best.r) best = {m, r} }); return best ? best.m : (meals.l.n ? 'l' : 'b') };
  let protFlag = false;
  if (t && late && s.p < 0.85 * t.p) { protFlag = true; const m = lowProtMeal(); add({id: 'prot', score: 66 + (goal === 'muscle' || sp ? 14 : 0), ic: '🍗', meal: m, role: 'protein', gap: t.p - s.p, title: K.t('an_prot', {x: r0(t.p - s.p)}), text: K.t('an_prot_p', {m: K.t(m).toLowerCase(), x: r0(meals[m].p), y: r0(meals[m].tp || 0)})}) }
  if ((goal === 'muscle' || sp) && list.length > 2 && !protFlag) { const tot = MEALS.reduce((a, m) => a + meals[m].p, 0), mx = MEALS.reduce((a, m) => meals[m].p > meals[a].p ? m : a, 'b'); if (tot > 40 && meals[mx].p / tot > 0.55) { const m = lowProtMeal(); add({id: 'prot_spread', score: 52, ic: '⚖️', meal: m, role: 'protein', title: K.t('an_prot_spread', {x: r0(100 * meals[mx].p / tot), m: K.t(mx).toLowerCase()}), text: K.t('an_prot_spread_p', {m: K.t(m).toLowerCase()})}) } }
  /* 3) rost */
  if (t && late && s.fib < 0.7 * t.fib) { const cand = ['b', 'l', 'd'].filter(m => meals[m].n).sort((a, b) => meals[a].fib - meals[b].fib), m = cand[0] || 'l'; add({id: 'fib', score: 56, ic: '🌾', meal: m, role: 'fibre', title: K.t('an_fib', {x: r0(t.fib - s.fib)}), text: K.t('an_fib_p')}) }
  /* 4) energia: a legnagyobb tétel megnevezése, sportolónál / tömegnövelésnél kevés energia esetén szénhidrát-kiegészítés */
  const big = list.slice().sort((a, b) => b.k - a.k)[0];
  if (t && done && s.k > 1.15 * t.kcal) add({id: 'kcal_over', score: 72, ic: '⚡', title: K.t('an_kcal_over', {x: r0((s.k - t.kcal) / 10) * 10}), text: K.t('an_kcal_over_p', {n: big.name, k: r0(big.k), h: r0(big.k / 2)})});
  if (t && done && s.k < 0.75 * t.kcal) add({id: 'kcal_low', score: 64, ic: '🔋', meal: sp || goal === 'gain' || goal === 'muscle' ? (meals.l.n ? 'l' : 'd') : null, role: sp || goal === 'gain' || goal === 'muscle' ? 'carb' : null, title: K.t('an_kcal_low', {x: r0((t.kcal - s.k) / 10) * 10}), text: K.t('an_kcal_low_p')});
  /* 5) hiányzó étkezés a naplóban */
  const miss = ['b', 'l', 'd'].filter(m => !meals[m].n && (m === 'b' || done)); if (done && miss.length && list.length >= 2) add({id: 'missing', score: 40, ic: '📓', title: K.t('an_missing', {m: miss.map(m => K.t(m).toLowerCase()).join(', ')}), text: K.t('an_missing_p')});
  /* 6) folyadék, só */
  const W = YT.waterOf(date), WT = t ? t.water : 1800; if (done && W < 0.7 * WT) add({id: 'water', score: 58, ic: '💧', title: K.t('an_water', {x: Math.round((WT - W) / 50) * 50}), text: K.t(sp ? 'an_water_sport' : 'an_water_p')});
  if (t && s.hasSalt && s.salt > t.salt) add({id: 'salt', score: 50, ic: '🧂', title: K.t('an_salt', {x: K.num(s.salt, 1)}), text: K.t('an_salt_p')});
  /* mi ment jól */
  if (done && vegAll >= 400) good.push(K.t('an_good_veg', {x: r0(vegAll / 10) * 10}));
  if (t && s.p >= 0.95 * t.p && late) good.push(K.t('an_good_prot'));
  if (t && s.fib >= 0.9 * t.fib && late) good.push(K.t('an_good_fib'));
  if (t && done && Math.abs(s.k / t.kcal - 1) <= 0.1) good.push(K.t('an_good_kcal'));
  if (done && MEALS.filter(m => meals[m].n).length >= 3 && meals.b.n) good.push(K.t('an_good_reg'));
  /* időpontok rendszeressége */
  const reg = YT.regularity(date, 7), regKeys = Object.keys(reg);
  regKeys.forEach(m => { const r = reg[m]; if (!r.ok) add({id: 'reg_' + m, score: 46 + Math.min(20, (r.range - 60) / 6), ic: '🕒', title: K.t('an_reg', {m: K.t(m).toLowerCase(), a: YT.t2s(r.min), b: YT.t2s(r.max)}), text: K.t('an_reg_p', {x: YT.t2s(r.med), r: Math.round(r.range)})}) });
  if (!regKeys.length && list.some(e => !e.t)) add({id: 'reg_none', score: 30, ic: '🕒', title: K.t('an_reg_none'), text: K.t('an_reg_none_p')});
  if (regKeys.length >= 2 && regKeys.every(m => reg[m].ok)) good.push(K.t('an_good_regt'));
  find.sort((a, b) => b.score - a.score);
  return {s, t, meals, veg: vegAll, good: good.slice(0, 3), find, W, WT, date, reg};
};

YT.svgLinePrint = (pts, label) => {   // pts: [{d, v}] – nyomtatáshoz: szó szerinti színek
  if (pts.length < 2) return ''; const W = 420, H = 140, pad = 34, ys = pts.map(x => x.v), mn = Math.min.apply(null, ys), mx = Math.max.apply(null, ys), span = Math.max(1e-6, mx - mn);
  const t0 = new Date(pts[0].d).getTime(), t1 = new Date(pts[pts.length - 1].d).getTime(), dt = Math.max(1, t1 - t0);
  const q = pts.map(x => [pad + (W - pad - 10) * (new Date(x.d).getTime() - t0) / dt, 12 + (H - 38) * (1 - (x.v - mn) / span)]);
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="420" height="140" role="img" aria-label="' + rEsc(label) + '"><polyline fill="none" stroke="#16805a" stroke-width="2" points="' + q.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') + '"/>' + q.map(p => '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2.6" fill="#16805a"/>').join('') +

};

/** Fájlok beolvasása és az import-képernyő megnyitása. files: [{name, bytes}|{name, big}] */

/* Your TÁP – játékok közös része: étel-csoportok és emojik, játék-adatok, jelvények, napi azonos menet kódja, hub képernyő.

:"A gabonák felét teljes kiőrlésű formában választani","en":"Choose half of your grains as whole grains"}],"a":3,"why":{"hu":"Az irányelvek azt javasolják, hogy a gabonák legalább fele teljes kiőrlésű legyen.","en":"The guidelines suggest making at least half of your grains whole grains."},"src":"USDA MyPlate; USDA/HHS Dietary Guidelines for Americans"},{"id":"qa04","lvl":"kezdo","topic":"feherje","q":{"hu":"Melyik növényi eredetű fehérjeforrás?","en":"Which of these is a plant-based protein source?"},"o":[{"hu":"Olívaolaj","en":"Olive oil"},{"hu":"Lencse","en":"Lentils"},{"hu":"Sima fehér cukor","en":"Plain white sugar"},{"hu":"Ásványvíz","en":"Mineral water"}],"a":1,"why":{"hu":"A hüvelyesek, például a lencse, a bab és a borsó, növényi fehérjeforrások.","en":"Legumes such as lentils, beans and peas are plant protein sources."},"src":"USDA/HHS Dietary Guidelines for Americans; NIH ODS"},{"id":"qa05","lvl":"kezdo","topic":"feherje","q":{"hu":"Miből épülnek fel a fehérjék?","en":"What are proteins made of?"},"o":[{"hu":"Cukormolekulákból","en":"Sugar molecules"},{"hu":"Ásványi sókból","en":"Mineral salts"},{"hu":"Vízből","en":"Water"},{"hu":"Aminosavakból","en":"Amino acids"}],"a":3,"why":{"hu":"A fehérjék aminosavakból épülnek fel, ezeket a szervezet építőkőként használja.","en":"Proteins are made of amino acids, which the body uses as building blocks."},"src":"NIH ODS; WHO: Healthy diet fact sheet"},{"id":"qa06","lvl":"kezdo","topic":"feherje","q":{"hu":"Melyik két étel is fehérjeforrás?","en":"Which two foods are both protein foods?"},"o":[{"hu":"Tojás és bab","en":"Eggs and beans"},{"hu":"Cukorka és üdítő","en":"Candy and soft drinks"},{"hu":"Olaj és vaj","en":"Oil and butter"},{"hu":"Sütemény és keksz","en":"Cake and biscuits"}],"a":0,"why":{"hu":"A tojás, a bab, a hal és a baromfi egyaránt a fehérjét adó ételek közé tartozik.","en":"Eggs, beans, fish and poultry all belong to the protein foods group."},"src":"USDA/HHS Dietary Guidelines for Americans; USDA MyPlate"},{"id":"qa07","lvl":"kezdo","topic":"rost","q":{"hu":"Melyik étel jó élelmirost-forrás?","en":"Which food is a good source of dietary fiber?"},"o":[{"hu":"Üdítőital","en":"Soft drink"},{"hu":"Vaj","en":"Butter"},{"hu":"Zabpehely","en":"Oats"},{"hu":"Asztali só","en":"Table salt"}],"a":2,"why":{"hu":"A zab és más teljes kiőrlésű gabonák, a hüvelyesek, zöldségek és gyümölcsök rostban gazdagok.","en":"Oats and other whole grains, legumes, vegetables and fruits are rich in fiber."},"src":"NIH ODS; USDA/HHS Dietary Guidelines for Americans"},{"id":"qa08","lvl":"kezdo","topic":"rost","q":{"hu":"Melyik étel tartalmaz gyakorlatilag nulla élelmi rostot?","en":"Which food contains practically no dietary fiber?"},"o":[{"hu":"Alma","en":"Apples"},{"hu":"Csirkemell","en":"Chicken breast"},{"hu":"Barna rizs","en":"Brown rice"},{"hu":"Brokkoli","en":"Broccoli"}],"a":1,"why":{"hu":"Az élelmi rost növényi eredetű, az állati eredetű ételekben, például a húsban nincs.","en":"Dietary fiber comes from plants, so animal foods such as meat contain none."},"src":"NIH ODS; USDA/HHS Dietary Guidelines for Americans"},{"id":"qa09","lvl":"kezdo","topic":"rost","q":{"hu":"Ha több rostot szeretnénk enni, mi a barátságos módszer?","en":"If you want to eat more fiber, what is a friendly approach?"},"o":[{"hu":"Fokozatosan emelni, és közben eleget inni","en":"Increase gradually and drink enough fluids"},{"hu":"Egyetlen nap alatt a sokszorosára emelni","en":"Multiply it many times in a single day"},{"hu":"Csak rostpótlót enni étel helyett","en":"Only use supplements instead of food"},{"hu":"Közben egyáltalán nem inni","en":"Not drinking at all"}],"a":0,"why":{"hu":"A rostbevitel fokozatos növelése és az elegendő folyadék segíti, hogy kényelmes maradjon.","en":"Raising fiber step by step and drinking enough fluids helps keep it comfortable."},"src":"NIH ODS; USDA/HHS Dietary Guidelines for Americans"},{"id":"qa10","lvl":"kezdo","topic":"viz","q":{"hu":"Melyik a jó mindennapi italválasztás?","en":"Which is a good everyday drink choice?"},"o":[{"hu":"Cukrozott üdítő","en":"Sugary soft drink"},{"hu":"Energiaital","en":"Energy drink"},{"hu":"Gyümölcsszirup hígítatlanul","en":"Undiluted fruit syrup"},{"hu":"Víz","en":"Water"}],"a":3,"why":{"hu":"A víz hozzáadott cukor nélkül hidratál, ezért kiváló mindennapi választás.","en":"Water hydrates without added sugar, so it is a great everyday choice."},"src":"WHO: Healthy diet fact sheet; USDA/HHS Dietary Guidelines for Americans"},{"id":"qa11","lvl":"kezdo","topic":"viz","q":{"hu":"Mitől függ, mennyi folyadékra van szükségünk?","en":"What does the amount of fluid we need depend on?"},"o":[{"hu":"Csak a hajszíntől","en":"Only hair colour"},{"hu":"Csak a cipőmérettől","en":"Only shoe size"},{"hu":"Például a mozgástól és a hőmérséklettől","en":"For example activity and temperature"},{"hu":"Semmitől, mindenkinek ugyanannyi","en":"Nothing, everyone needs the same"}],"a":2,"why":{"hu":"A folyadékigény változik, például több mozgás vagy meleg időjárás mellett nő.","en":"Fluid needs vary, and rise for example with more activity or hot weather."},"src":"NIH ODS; USDA/HHS Dietary Guidelines for Americans"},{"id":"qa12","lvl":"kezdo","topic":"so_cukor","q":{"hu":"A WHO ajánlása szerint naponta nagyjából mennyi sónál érdemes kevesebbet fogyasztani felnőttként?","en":"According to WHO, adults are advised to eat less than about how much salt per day?"},"o":[{"hu":"1 gramm","en":"1 gram"},{"hu":"5 gramm","en":"5 grams"},{"hu":"25 gramm","en":"25 grams"},{"hu":"50 gramm","en":"50 grams"}],"a":1,"why":{"hu":"A WHO napi 5 gramm (kb. egy teáskanál) alatti sófogyasztást javasol felnőtteknek.","en":"WHO recommends adults keep salt under 5 grams a day, about one teaspoon."},"src":"WHO: Healthy diet fact sheet; WHO: Salt reduction"},{"id":"qa13","lvl":"kezdo","topic":"so_cukor","q":{"hu":"Honnan származik gyakran a sóbevitel jelentős része?","en":"Where does a large part of salt intake often come from?"},"o":[{"hu":"Feldolgozott élelmiszerekből, például pékáruból és szószokból","en":"Processed foods such as bread and sauces"},{"hu":"Friss gyümölcsből","en":"Fresh fruit"},{"hu":"Ivóvízből","en":"Drinking water"},{"hu":"Fehér cukorból","en":"White sugar"}],"a":0,"why":{"hu":"Sok sót a feldolgozott ételek rejtenek, ezért érdemes a címkét is megnézni.","en":"Much salt hides in processed foods, so checking the label is useful."},"src":"WHO: Salt reduction; USDA/HHS Dietary Guidelines for Americans"},{"id":"qa14","lvl":"kezdo","topic":"so_cukor","q":{"hu":"A WHO a szabad cukrokat az energiabevitel mekkora része alatt javasolja tartani?","en":"WHO advises keeping free sugars below what share of total energy intake?"},"o":[{"hu":"50%","en":"50%"},{"hu":"30%","en":"30%"},{"hu":"25%","en":"25%"},{"hu":"10%","en":"10%"}],"a":3,"why":{"hu":"A WHO az energiabevitel kevesebb mint 10%-át javasolja szabad cukorból.","en":"WHO suggests free sugars stay under 10% of total energy intake."},"src":"WHO: Healthy diet fact sheet"},{"id":"qa15","lvl":"kezdo","topic":"cimke","q":{"hu":"Mire jó az ételcímkén a 100 grammra vetített érték?","en":"What is the per-100 g value on a food label useful for?"},"o":[{"hu":"Arra, hogy hány darab van a csomagban","en":"Telling how many pieces are in the pack"},{"hu":"Arra, hogy hol gyártották","en":"Telling where it was made"},{"hu":"Arra, hogy összehasonlítsunk különböző termékeket","en":"Comparing different products with each other"},{"hu":"Arra, hogy meddig tartható el","en":"Telling how long it keeps"}],"a":2,"why":{"hu":"A 100 g-ra vetített adat egységes alap, így a termékek könnyen összevethetők.","en":"Per-100 g values give a common basis, so products are easy to compare."},"src":"EU 1169/2011 food information regulation"},{"id":"qa16","lvl":"kezdo","topic":"cimke","q":{"hu":"Hogyan sorolják fel az összetevőket az EU-s címkén?","en":"How are ingredients listed on an EU food label?"},"o":[{"hu":"Ábécé sorrendben","en":"Alphabetically"},{"hu":"Ár szerint","en":"By price"},{"hu":"A legnagyobb tömegű összetevőtől a legkisebbig","en":"From the largest weight to the smallest"},{"hu":"Véletlenszerű sorrendben","en":"In random order"}],"a":2,"why":{"hu":"Az összetevők csökkenő tömegük szerint következnek, az első a legnagyobb mennyiségű.","en":"Ingredients appear in descending order by weight, so the first is the largest amount."},"src":"EU 1169/2011 food information regulation"},{"id":"qa17","lvl":"kezdo","topic":"ritmus","q":{"hu":"Mit jelent az étrendi mintázat?","en":"What does a dietary pattern mean?"},"o":[{"hu":"Egyetlen étkezés tökéletessége","en":"The perfection of a single meal"},{"hu":"Az egész, hosszabb idő alatt elfogyasztott étel és ital összessége","en":"Everything you eat and drink over a longer time"},{"hu":"Csak a vacsora","en":"Only dinner"},{"hu":"Csak az ünnepi étkezések","en":"Only holiday meals"}],"a":1,"why":{"hu":"Az irányelvek szerint a hosszabb távú összkép számít, nem egyetlen étkezés.","en":"The guidelines focus on the overall pattern over time rather than one single meal."},"src":"USDA/HHS Dietary Guidelines for Americans"},{"id":"qa18","lvl":"kezdo","topic":"ritmus","q":{"hu":"Melyik nasi illik jól egy kiegyensúlyozott étkezési mintázatba?","en":"Which snack fits well in a balanced eating pattern?"},"o":[{"hu":"Csak cukorka","en":"Only candy"},{"hu":"Csak chips","en":"Only crisps"},{"hu":"Semmi, mert a nasi tiltott","en":"Nothing, snacks are forbidden"},{"hu":"Gyümölcs egy marék dióval","en":"Fruit with a handful of nuts"}],"a":3,"why":{"hu":"A tápanyagokban gazdag nasi, például gyümölcs és dió, jól illik az étkezések közé.","en":"Nutrient-dense snacks such as fruit and nuts fit nicely between meals."},"src":"USDA/HHS Dietary Guidelines for Americans"},{"id":"qb01","lvl":"halado","topic":"zsir","q":{"hu":"Melyik zsiradék túlnyomórészt telítetlen zsírsavakból áll?","en":"Which fat is made up mostly of unsaturated fatty acids?"},"o":[{"hu":"Vaj","en":"Butter"},{"hu":"Sertészsír","en":"Lard"},{"hu":"Olívaolaj","en":"Olive oil"},{"hu":"Teljes tejszín","en":"Double cream"}],"a":2,"why":{"hu":"Az olívaolaj főként egyszeresen telítetlen zsírsavakat tartalmaz, míg a vaj és a sertészsír nagyobb arányban telített zsírt.","en":"Olive oil is mostly monounsaturated fat, while butter and lard contain a higher share of saturated fat."},"src":"USDA/HHS Dietary Guidelines for Americans; WHO Healthy diet"},{"id":"qb02","lvl":"halado","topic":"zsir","q":{"hu":"Melyik élelmiszer gazdag az omega-3 zsírsavakban?","en":"Which food is a good source of omega-3 fatty acids?"},"o":[{"hu":"Zsíros tengeri hal, például lazac vagy hering","en":"Fatty sea fish such as salmon or herring"},{"hu":"Fehér rizs","en":"White rice"},{"hu":"Főtt burgonya","en":"Boiled potato"},{"hu":"Alma","en":"Apple"}],"a":0,"why":{"hu":"A zsíros tengeri halak EPA-t és DHA-t adnak; növényi forrás például a dió és a lenmag (ALA).","en":"Fatty sea fish provide EPA and DHA; plant sources include walnuts and flaxseed (ALA)."},"src":"NIH Office of Dietary Supplements; USDA/HHS Dietary Guidelines for Americans"},{"id":"qb03","lvl":"halado","topic":"rost","q":{"hu":"Mi jellemző az oldhatatlan élelmi rostra?","en":"What is typical of insoluble dietary fibre?"},"o":[{"hu":"Kizárólag állati eredetű élelmiszerekben található","en":"It is found only in animal foods"},{"hu":"Nem képez gélt, inkább tömeget ad, és teljes kiőrlésű gabonákban, korpában bőven van","en":"It does not form a gel but adds bulk, and is plentiful in whole grains and bran"},{"hu":"Vízben teljesen feloldódik, és ital lesz belőle","en":"It dissolves fully in water into a drink"},{"hu":"Növényekben egyáltalán nem fordul elő","en":"It never occurs in plants"}],"a":1,"why":{"hu":"Az oldhatatlan rost növényi eredetű, és hozzájárul a rendszeres emésztéshez; az oldódó rost (pl. zab, bab) gélt képez.","en":"Insoluble fibre is plant-based and supports regular digestion, while soluble fibre (e.g. oats, beans) forms a gel."},"src":"USDA/HHS Dietary Guidelines for Americans; WHO Healthy diet"},{"id":"qb04","lvl":"halado","topic":"rost","q":{"hu":"Melyik élelmiszercsoport természetes módon gyakorlatilag nem tartalmaz élelmi rostot?","en":"Which food group naturally contains practically no dietary fibre?"},"o":[{"hu":"Hüvelyesek, például lencse","en":"Legumes such as lentils"},{"hu":"Teljes kiőrlésű gabonák","en":"Whole grains"},{"hu":"Gyümölcsök héjjal, például körte","en":"Fruit with skin, such as pears"},{"hu":"Hús és tojás","en":"Meat and eggs"}],"a":3,"why":{"hu":"Az élelmi rost kizárólag növényi eredetű; az állati termékek (hús, tojás, tej) természetesen nem tartalmaznak.","en":"Dietary fibre comes only from plants; animal products such as meat, eggs and milk have none naturally."},"src":"USDA/HHS Dietary Guidelines for Americans; WHO Healthy diet"},{"id":"qb05","lvl":"halado","topic":"feherje","q":{"hu":"Melyik növényi kombináció egészíti ki jól egymást az aminosav-összetétel szempontjából?","en":"Which plant pairing complements each other well in amino acid makeup?"},"o":[{"hu":"Rizs és bab","en":"Rice and beans"},{"hu":"Fehér kenyér és tészta","en":"White bread and pasta"},{"hu":"Alma és körte","en":"Apple and pear"},{"hu":"Étolaj és cukor","en":"Cooking oil and sugar"}],"a":0,"why":{"hu":"A gabonafélék és a hüvelyesek aminosav-profilja kiegészíti egymást; nem kell egyetlen étkezésen belül lenniük.","en":"Grains and legumes have complementary amino acid profiles; they need not be in the same meal."},"src":"USDA/HHS Dietary Guidelines for Americans; WHO Healthy diet"},{"id":"qb06","lvl":"halado","topic":"feherje","q":{"hu":"Mit jelent, ha egy fehérjeforrás „teljes értékű”?","en":"What does it mean when a protein source is called 'complete'?"},"o":[{"hu":"Csak növényi eredetű lehet","en":"It can only come from plants"},{"hu":"Csak egyetlen aminosavat tartalmaz, nagy mennyiségben","en":"It contains just one amino acid in large amounts"},{"hu":"Minden esszenciális aminosavat megfelelő arányban tartalmaz","en":"It contains all essential amino acids in adequate proportions"},{"hu":"Fehérjén kívül semmi mást nem tartalmaz","en":"It contains nothing besides protein"}],"a":2,"why":{"hu":"A teljes értékű fehérje az összes esszenciális aminosavat tartalmazza; ilyen például a tojás, a tej, de a szója is.","en":"A complete protein supplies all the essential amino acids; eggs, milk and also soy are examples."},"src":"USDA/HHS Dietary Guidelines for Americans; WHO Healthy diet"},{"id":"qb07","lvl":"halado","topic":"mikro","q":{"hu":"Mi segíti a növényi eredetű vas felszívódását, ha egy étkezéssel együtt fogyasztjuk?","en":"What helps the absorption of plant-based iron when eaten in the same meal?"},"o":[{"hu":"Erős tea az étkezés közben","en":"Strong tea during the meal"},{"hu":"C-vitaminban gazdag étel, például paprika vagy citrus","en":"Vitamin C-rich food such as bell pepper or citrus"},{"hu":"Még több cukor","en":"Extra sugar"},{"hu":"Az étkezés teljes kihagyása","en":"Skipping the meal"}],"a":1,"why":{"hu":"A C-vitamin javítja a nem-hem (növényi) vas felszívódását; a tea polifenoljai éppen csökkenthetik.","en":"Vitamin C improves non-heme (plant) iron absorption, whereas tea polyphenols can reduce it."},"src":"NIH Office of Dietary Supplements"},{"id":"qb08","lvl":"halado","topic":"mikro","q":{"hu":"Melyik tejmentes élelmiszer lehet jó kalciumforrás?","en":"Which dairy-free food can be a good calcium source?"},"o":[{"hu":"Olívaolaj","en":"Olive oil"},{"hu":"Kristálycukor","en":"Granulated sugar"},{"hu":"Fehér rizs","en":"White rice"},{"hu":"Kalciumsóval alvasztott tofu","en":"Calcium-set tofu"}],"a":3,"why":{"hu":"A kalciumsóval készült tofu és a kalciummal dúsított növényi italok tejmentes kalciumforrások lehetnek; a címkén érdemes ellenőrizni.","en":"Calcium-set tofu and calcium-fortified plant drinks can be dairy-free calcium sources; check the label."},"src":"NIH Office of Dietary Supplements"},{"id":"qb09","lvl":"halado","topic":"mikro","q":{"hu":"Melyik két forrás járul hozzá leginkább az ember D-vitamin-ellátásához?","en":"Which two sources contribute most to a person's vitamin D supply?"},"o":[{"hu":"Fehér liszt és só","en":"White flour and salt"},{"hu":"Cukros üdítő és chips","en":"Sugary soda and crisps"},{"hu":"Zsíros hal és a bőrre jutó napfény","en":"Fatty fish and sunlight on the skin"},{"hu":"Saláta és uborka","en":"Lettuce and cucumber"}],"a":2,"why":{"hu":"A bőrben napfény hatására D-vitamin képződik, és a zsíros halak is tartalmazzák; kevés más élelmiszer gazdag benne.","en":"Sunlight on skin makes vitamin D, and fatty fish contain it; few other foods are rich in it."},"src":"NIH Office of Dietary Supplements"},{"id":"qb10","lvl":"halado","topic":"mikro","q":{"hu":"Melyik gyakori élelmiszer vagy összetevő jódforrás?","en":"Which common food or ingredient is a source of iodine?"},"o":[{"hu":"Jódozott só és tengeri hal","en":"Iodised salt and sea fish"},{"hu":"Olívaolaj","en":"Olive oil"},{"hu":"Mogyoróvaj","en":"Peanut butter"},{"hu":"Fehér cukor","en":"White sugar"}],"a":0,"why":{"hu":"A tengeri halak, a tejtermékek és a jódozott só jelentős jódforrások; az olaj és a cukor nem.","en":"Sea fish, dairy and iodised salt are meaningful iodine sources; oils and sugar are not."},"src":"NIH Office of Dietary Supplements"},{"id":"qb11","lvl":"halado","topic":"biztonsag","q":{"hu":"Mivel csökkenthető leginkább a kereszt-szennyezés a konyhában?","en":"What best reduces cross-contamination in the kitchen?"},"o":[{"hu":"Ugyanaz a kés, csak gyors törlés után","en":"Same knife, just a quick wipe"},{"hu":"Külön vágódeszka és eszköz a nyers húsnak és a készen fogyasztható ételnek","en":"Separate boards and utensils for raw meat and ready-to-eat food"},{"hu":"A nyers hús mosása csapvízzel","en":"Rinsing raw meat under the tap"},{"hu":"A nyers hús a saláta mellé a pultra","en":"Leaving raw meat next to the salad on the counter"}],"a":1,"why":{"hu":"A külön eszközök megakadályozzák, hogy a nyers húsból baktérium kerüljön a nem átsütött ételre; a hús mosása inkább szétfröcskölheti a baktériumokat.","en":"Separate tools keep bacteria from raw meat off food that will not be cooked; rinsing meat can splash bacteria around."},"src":"USDA FoodSafety.gov"},{"id":"qb12","lvl":"halado","topic":"biztonsag","q":{"hu":"Mennyi időn belül érdemes a maradékot hűtőbe tenni, ha szobahőmérsékleten állt?","en":"Within what time should leftovers go into the fridge after sitting at room temperature?"},"o":[{"hu":"Legfeljebb 2 napon belül","en":"Within 2 days"},{"hu":"Egy hét múlva is bőven jó","en":"A week later is fine"},{"hu":"Nincs időkorlát, ha jó szagú","en":"No limit if it smells fine"},{"hu":"Legfeljebb kb. 2 órán belül","en":"Within about 2 hours"}],"a":3,"why":{"hu":"A szobahőmérsékleten hagyott ételben a baktériumok gyorsan szaporodnak, ezért a maradékot nagyjából 2 órán belül hűtjük le.","en":"Bacteria multiply quickly in food left out, so leftovers should be chilled within about 2 hours."},"src":"USDA FoodSafety.gov"},{"id":"qb13","lvl":"halado","topic":"biztonsag","q":{"hu":"Mit jelent a „hűtőlánc”?","en":"What does the 'cold chain' mean?"},"o":[{"hu":"A hűtött élelmiszerek megszakítatlan hűtése a gyártótól a fogyasztóig","en":"Keeping chilled food continuously cold from producer to consumer"},{"hu":"Egy hűtőszekrény-márka neve","en":"The name of a fridge brand"},{"hu":"A főzés utáni gyors felmelegítés","en":"Quick reheating after cooking"},{"hu":"Az étel sózása tartósításhoz","en":"Salting food to preserve it"}],"a":0,"why":{"hu":"Ha a hűtés megszakad (pl. a vásárlás hosszan a kocsiban marad), a baktériumok szaporodása felgyorsulhat.","en":"If cooling is interrupted (e.g. groceries left long in a car), bacterial growth can speed up."},"src":"USDA FoodSafety.gov; EFSA"},{"id":"qb14","lvl":"halado","topic":"cimke","q":{"hu":"Melyik összetevőnév jelent hozzáadott cukrot az összetevők listáján?","en":"Which ingredient name on a list means added sugar?"},"o":[{"hu":"Lecitin","en":"Lecithin"},{"hu":"Pektin","en":"Pectin"},{"hu":"Glükóz-fruktózszirup","en":"Glucose-fructose syrup"},{"hu":"Citromsav","en":"Citric acid"}],"a":2,"why":{"hu":"A cukornak sok neve van (szirupok, dextróz, maltóz); a lecitin, a pektin és a citromsav adalékanyagok, nem cukrok.","en":"Sugar has many names (syrups, dextrose, maltose); lecithin, pectin and citric acid are not sugars."},"src":"EU 1169/2011; WHO Healthy diet"},{"id":"qb15","lvl":"halado","topic":"cimke","q":{"hu":"Milyen sorrendben kell az összetevőket a címkén felsorolni az EU szabályai szerint?","en":"In what order must ingredients be listed on a label under EU rules?"},"o":[{"hu":"Betűrendben","en":"Alphabetically"},{"hu":"Tömegük szerint csökkenő sorrendben","en":"In descending order of weight"},{"hu":"Növekvő ár szerint","en":"By ascending price"},{"hu":"Tetszőleges sorrendben","en":"In any order"}],"a":1,"why":{"hu":"Az 1169/2011 rendelet szerint a legtöbbet tartalmazó összetevő áll elöl, így a lista elején lévő cukor sokat sejtet.","en":"Under Regulation 1169/2011 the largest ingredient comes first, so sugar near the top hints at a lot."},"src":"EU 1169/2011"},{"id":"qb16","lvl":"halado","topic":"cimke","q":{"hu":"Az EU 1924/2006 rendelete szerint mikor szerepelhet a „cukormentes” jelölés?","en":"Under EU Regulation 1924/2006, when may a product say 'sugar-free'?"},"o":[{"hu":"Legfeljebb 0,5 g cukor/100 g vagy 100 ml","en":"No more than 0.5 g sugars per 100 g or 100 ml"},{"hu":"Legfeljebb 5 g cukor/100 g","en":"Up to 5 g sugars per 100 g"},{"hu":"Ha nincs hozzáadott cukor, bármennyi természetes cukorral","en":"If no sugar is added, whatever natural sugar it has"},{"hu":"Ha a csomagolás zöld","en":"If the packaging is green"}],"a":0,"why":{"hu":"A „cukormentes” állításhoz a termék cukortartalma legfeljebb 0,5 g/100 g (vagy 100 ml) lehet.","en":"A 'sugar-free' claim requires no more than 0.5 g of sugars per 100 g (or 100 ml)."},"src":"EU 1924/2006"},{"id":"qb17","lvl":"halado","topic":"folyadek","q":{"hu":"Az EFSA szerint egészséges felnőtteknél mekkora az egyszeri ko
